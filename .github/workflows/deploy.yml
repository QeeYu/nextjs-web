name: Deploy to VPS

on:
  push:
    branches: [main]

# ============================================================
# 部署策略：与 next.config.ts 的 output: "export" 保持一致
#   - 在 GitHub Actions 云端构建，产出静态站点 out/
#   - 通过 rsync 同步到 VPS 的 Nginx 网站根目录
#   - 服务器上无需 Node 运行时、无需常驻进程
#
# 需要的 Repository Secrets：
#   HOST             → VPS IP / 域名
#   USERNAME         → SSH 用户
#   SSH_PRIVATE_KEY  → SSH 私钥（含换行）
#   DEPLOY_PATH      → Nginx 站点目录（如 /var/www/qeeyu/）
# ============================================================

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (static export → out/)
        run: npm run build

      - name: Rsync out/ to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: out/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}